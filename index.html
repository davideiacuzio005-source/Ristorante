<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12171f">
<title>Chiusura cassa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#12171f; --panel:#19202a; --field:#202938; --line:#2c3748;
    --text:#eceff4; --dim:#8b96a8; --brass:#d3ad55; --brass-ink:#1a1405;
    --green:#5ec27a; --blue:#6aaeff; --red:#ff6b63; color-scheme:dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#eef0f3; --panel:#fff; --field:#f2f4f7; --line:#d9dee6; --text:#161b24; --dim:#5d687a;
      --brass:#8f6b12; --brass-ink:#fff; --green:#1f8a43; --blue:#1b6fd1; --red:#d3322b; color-scheme:light;
    }
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body {
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text); line-height:1.4; min-height:100vh;
    font-variant-numeric:tabular-nums;
    padding:calc(20px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));
  }
  .wrap { max-width:1060px; margin:0 auto; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { font-size:clamp(24px,5vw,32px); font-weight:800; letter-spacing:-.02em; }
  .sub { color:var(--dim); font-size:14px; }
 
  .layout { display:grid; gap:14px; }
  .col { display:grid; gap:14px; align-content:start; min-width:0; }
  .counts { display:grid; gap:14px; }
 
  section { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 18px 8px; }
  .sec-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  h2 { font-size:16px; font-weight:700; }
  .sec-total { font-size:16px; font-weight:800; color:var(--brass); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding-bottom:12px; }
  .one { padding-bottom:12px; }
  @media (max-width:380px){ .two{ grid-template-columns:1fr; } }
  .field label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; font-weight:600; }
 
  input {
    width:100%; min-height:48px; background:var(--field); border:1.5px solid var(--line); border-radius:12px;
    color:var(--text); font:inherit; font-size:17px; font-weight:600; padding:10px 12px; outline:none;
    -moz-appearance:textfield; font-variant-numeric:tabular-nums; transition:border-color .15s, box-shadow .15s;
  }
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  input::placeholder { color:var(--dim); opacity:.55; }
  input:focus-visible { border-color:var(--brass); box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 28%,transparent); }
  input.error { border-color:var(--red); box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 20%,transparent); }
 
  .row { display:grid; grid-template-columns:58px minmax(0,1fr) 92px; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row label { font-weight:700; font-size:16px; }
  .row input { text-align:right; }
  .amt { text-align:right; font-size:14px; color:var(--dim); font-weight:600; white-space:nowrap; }
  .amt.on { color:var(--text); }
 
  aside { display:grid; gap:12px; align-content:start; min-width:0; }
  .live { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 18px; display:grid; gap:6px; }
  .live div { display:flex; justify-content:space-between; font-size:14px; color:var(--dim); font-weight:600; }
  .live b { color:var(--text); font-weight:700; }
  .live .grand { border-top:1px dashed var(--line); padding-top:8px; margin-top:2px; color:var(--text); font-size:15px; }
  .live .grand b { color:var(--brass); font-size:17px; }
 
  #errMsg { color:var(--red); font-size:14px; font-weight:600; display:none; padding:0 2px; }
  #errMsg.visible { display:block; }
  .actions { display:grid; grid-template-columns:1fr auto; gap:10px; }
  button { font:inherit; font-size:16px; font-weight:700; cursor:pointer; border-radius:14px; padding:16px; min-height:54px; -webkit-tap-highlight-color:transparent; }
  button:focus-visible { outline:3px solid color-mix(in srgb,var(--brass) 55%,transparent); outline-offset:2px; }
  .primary { background:var(--brass); color:var(--brass-ink); border:0; }
  .primary:active { transform:scale(.99); }
  .ghost { background:transparent; color:var(--dim); border:1.5px solid var(--line); padding:16px 20px; }
  @media (hover:hover){ .ghost:hover{ color:var(--text); } .primary:hover{ filter:brightness(1.06); } }
 
  #results { display:none; gap:12px; }
  #results.visible { display:grid; }
  .receipt { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px 20px 30px; position:relative; overflow:hidden; }
  .receipt::after { content:''; position:absolute; left:0; right:0; bottom:0; height:8px;
    background:radial-gradient(circle at 8px 8px,var(--bg) 5px,transparent 5.5px) 0 0/16px 8px repeat-x; }
  .r-date { color:var(--dim); font-size:14px; text-transform:capitalize; }
  .r-label { margin-top:14px; font-size:14px; color:var(--dim); font-weight:600; }
  .r-total { font-size:clamp(36px,10vw,50px); font-weight:800; letter-spacing:-.03em; color:var(--brass); line-height:1.1; overflow-wrap:anywhere; }
  .r-line { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:12px 0; border-top:1px dashed var(--line); font-size:16px; }
  .r-line.first { margin-top:16px; }
  .r-line span { color:var(--dim); font-weight:500; }
  .r-line b { font-weight:700; }
  #rContante { color:var(--blue); } #rPOS { color:var(--green); }
  .neg { color:var(--red) !important; }
  .btn-mail { background:transparent; color:var(--text); border:1.5px solid var(--brass); width:100%; }
  @media (hover:hover){ .btn-mail:hover{ background:color-mix(in srgb,var(--brass) 12%,transparent); } }
  .btn-mail:disabled { opacity:.55; cursor:progress; }
 
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,140px); transition:transform .25s ease;
    background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:12px 18px; font-size:14px; font-weight:600;
    width:max-content; max-width:calc(100% - 28px); text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:10; }
  #toast.show { transform:translate(-50%,0); }
  #toast.success { border-color:var(--green); color:var(--green); }
  #toast.fail { border-color:var(--red); color:var(--red); }
 
  /* Tablet: monete e banconote affiancate */
  @media (min-width:700px){ .counts{ grid-template-columns:1fr 1fr; align-items:start; } body{ padding-top:32px; } }
  /* PC: form a sinistra, riepilogo fisso a destra */
  @media (min-width:960px){
    .layout{ grid-template-columns:minmax(0,1fr) 360px; gap:20px; align-items:start; }
    aside{ position:sticky; top:24px; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chiusura cassa</h1>
    <span class="sub">Riepilogo giornaliero</span>
  </header>
 
  <div class="layout">
    <div class="col">
      <section>
        <div class="sec-head"><h2>Dati della giornata</h2></div>
        <div class="two">
          <div class="field"><label for="data">Data</label><input type="date" id="data" required></div>
          <div class="field"><label for="fondo">Fondo cassa (€)</label><input type="number" id="fondo" placeholder="0.00" step="0.01" min="0" inputmode="decimal" required></div>
        </div>
      </section>
 
      <div class="counts">
        <section>
          <div class="sec-head"><h2>Monete</h2><span class="sec-total" id="tMonete">€ 0,00</span></div>
          <div id="listMonete"></div>
        </section>
        <section>
          <div class="sec-head"><h2>Banconote</h2><span class="sec-total" id="tBanconote">€ 0,00</span></div>
          <div id="listBanconote"></div>
        </section>
      </div>
 
      <section>
        <div class="sec-head"><h2>Incasso POS</h2></div>
        <div class="one"><div class="field"><label for="pos">Totale POS (€)</label><input type="number" id="pos" placeholder="0.00" step="0.01" min="0" inputmode="decimal" required></div></div>
      </section>
    </div>
 
    <aside>
      <div class="live" aria-label="Anteprima conteggio">
        <div><span>Monete</span><b id="lMonete">€ 0,00</b></div>
        <div><span>Banconote</span><b id="lBanconote">€ 0,00</b></div>
        <div class="grand"><span>Contante contato</span><b id="lCount">€ 0,00</b></div>
      </div>
 
      <p id="errMsg" role="alert">Compila tutti i campi evidenziati prima di calcolare.</p>
      <div class="actions">
        <button class="primary" onclick="calcola()">Calcola chiusura</button>
        <button class="ghost" onclick="azzera()" title="Svuota tutti i campi">Azzera</button>
      </div>
 
      <div id="results" aria-live="polite">
        <div class="receipt">
          <div class="r-date" id="rData"></div>
          <div class="r-label">Guadagno totale</div>
          <div class="r-total" id="rTotale">€ 0,00</div>
          <div class="r-line first"><span>Guadagno contante</span><b id="rContante">€ 0,00</b></div>
          <div class="r-line"><span>Guadagno POS</span><b id="rPOS">€ 0,00</b></div>
        </div>
        <button class="btn-mail" id="btnMail" onclick="inviaMail()">Invia report via email</button>
      </div>
    </aside>
  </div>
</div>
 
<div id="toast" role="status" aria-live="polite"></div>
 
<script>
  const MONETE = [['m001','1 cent',0.01],['m002','2 cent',0.02],['m005','5 cent',0.05],['m010','10 cent',0.10],
                  ['m020','20 cent',0.20],['m050','50 cent',0.50],['m100','1 €',1],['m200','2 €',2]];
  const BANCONOTE = [['b005','5 €',5],['b010','10 €',10],['b020','20 €',20],['b050','50 €',50],
                     ['b100','100 €',100],['b200','200 €',200],['b500','500 €',500]];
 
  const IDS = ['data','fondo',...MONETE.map(x=>x[0]),...BANCONOTE.map(x=>x[0]),'pos'];
  const $ = id => document.getElementById(id);
  const g = id => parseFloat($(id).value) || 0;
  const fmt = n => '€\u00a0' + n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
 
  function build(list, rows){
    $(list).innerHTML = rows.map(([id,label]) =>
      `<div class="row"><label for="${id}">${label}</label>` +
      `<input type="number" id="${id}" placeholder="0" step="0.01" min="0" inputmode="decimal" required>` +
      `<span class="amt" id="s_${id}">€\u00a00,00</span></div>`).join('');
  }
  build('listMonete', MONETE);
  build('listBanconote', BANCONOTE);
 
  (function(){
    const d = new Date();
    $('data').value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  })();
 
  function aggiorna(){
    let tm = 0, tb = 0;
    MONETE.forEach(([id,,v]) => { const s = g(id)*v; tm += s; setAmt(id,s); });
    BANCONOTE.forEach(([id,,v]) => { const s = g(id)*v; tb += s; setAmt(id,s); });
    $('tMonete').textContent = $('lMonete').textContent = fmt(tm);
    $('tBanconote').textContent = $('lBanconote').textContent = fmt(tb);
    $('lCount').textContent = fmt(tm + tb);
  }
  function setAmt(id, s){
    const el = $('s_'+id);
    el.textContent = fmt(s);
    el.classList.toggle('on', s > 0);
  }
 
  let lastTotale=0, lastContante=0, lastPOS=0, lastData='';
 
  function valida(){
    let ok = true, first = null;
    IDS.forEach(id => {
      const el = $(id);
      const vuoto = el.value.trim() === '';
      el.classList.toggle('error', vuoto);
      if(vuoto){ ok = false; if(!first) first = el; }
    });
    if(first) first.focus();
    return ok;
  }
 
  IDS.forEach((id, i) => {
    const el = $(id);
    el.addEventListener('input', () => {
      if(el.value.trim() !== ''){
        el.classList.remove('error');
        if(!document.querySelector('input.error')) $('errMsg').classList.remove('visible');
      }
      aggiorna();
    });
    el.addEventListener('focus', () => { if(el.type === 'number') setTimeout(() => el.select(), 0); });
    el.addEventListener('wheel', () => el.blur(), {passive:true});   // evita cambi accidentali con la rotella
    el.addEventListener('keydown', e => {
      if(e.key !== 'Enter') return;
      e.preventDefault();
      if(i < IDS.length-1) $(IDS[i+1]).focus(); else calcola();
    });
  });
 
  function calcola(){
    if(!valida()){ $('errMsg').classList.add('visible'); return; }
    $('errMsg').classList.remove('visible');
 
    const monete = MONETE.reduce((s,[id,,v]) => s + g(id)*v, 0);
    const banconote = BANCONOTE.reduce((s,[id,,v]) => s + g(id)*v, 0);
    const fondo = g('fondo');
    const pos = g('pos');
 
    const contante = monete + banconote - fondo;
    const totale = contante + pos;
 
    lastTotale = totale; lastContante = contante; lastPOS = pos; lastData = $('data').value;
 
    $('rTotale').textContent = fmt(totale);
    $('rContante').textContent = fmt(contante);
    $('rPOS').textContent = fmt(pos);
    $('rTotale').classList.toggle('neg', totale < 0);
    $('rContante').classList.toggle('neg', contante < 0);
    $('rData').textContent = lastData ? new Date(lastData+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : '';
 
    $('results').classList.add('visible');
    $('btnMail').disabled = false;
    $('results').scrollIntoView({behavior:'smooth', block:'nearest'});
  }
 
  function azzera(){
    if(!confirm('Svuotare tutti i campi?')) return;
    IDS.forEach(id => { if(id !== 'data') $(id).value = ''; $(id).classList.remove('error'); });
    $('errMsg').classList.remove('visible');
    $('results').classList.remove('visible');
    aggiorna();
    window.scrollTo({top:0});
    $('fondo').focus();
  }
 
  let toastTimer;
  function showToast(msg, type){
    const t = $('toast');
    t.textContent = msg;
    t.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, 3500);
  }
 
  async function inviaMail(){
    const btn = $('btnMail');
    btn.disabled = true;
    btn.textContent = 'Invio in corso…';
 
    const dataFmt = lastData ? new Date(lastData+'T12:00:00').toLocaleDateString('it-IT') : '-';
 
    try {
      const res = await fetch('https://formsubmit.co/ajax/davideiacuzio005@gmail.com', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Accept': 'application/json'
        },
        body: `_subject=${encodeURIComponent('CHIUSURA CASSA - ' + dataFmt)}` +
              `&_captcha=false` +
              `&_template=table` +
              `&Data=${encodeURIComponent(dataFmt)}` +
              `&Guadagno_Totale=${encodeURIComponent(fmt(lastTotale))}` +
              `&Guadagno_Contante=${encodeURIComponent(fmt(lastContante))}` +
              `&Guadagno_POS=${encodeURIComponent(fmt(lastPOS))}`
      });
      const json = await res.json();
      if(json.success === 'true' || json.success === true){
        showToast('Report inviato a davideiacuzio005@gmail.com', 'success');
      } else {
        throw new Error('fail');
      }
    } catch(e){
      showToast('Invio non riuscito. Controlla la connessione e riprova.', 'fail');
    }
 
    btn.disabled = false;
    btn.textContent = 'Invia report via email';
  }
</script>
</body>
</html>
